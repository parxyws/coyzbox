<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>You're Invited!</title>
    <style>
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            line-height: 1.6;
            color: #333;
            margin: 0;
            padding: 0;
            background-color: #f4f7f9;
        }
        .container {
            max-width: 600px;
            margin: 40px auto;
            background: #ffffff;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
        }
        .header {
            background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
            padding: 40px 20px;
            text-align: center;
            color: white;
        }
        .content {
            padding: 40px;
            text-align: center;
        }
        .footer {
            padding: 20px;
            text-align: center;
            font-size: 12px;
            color: #666;
            background-color: #f9fafb;
        }
        h1 {
            margin: 0;
            font-size: 24px;
            font-weight: 700;
        }
        p {
            font-size: 16px;
            color: #4b5563;
            margin-bottom: 24px;
        }
        .btn {
            display: inline-block;
            padding: 14px 32px;
            background-color: #4f46e5;
            color: #ffffff !important;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 16px;
            transition: background-color 0.2s;
        }
        .btn:hover {
            background-color: #4338ca;
        }
        .tenant-name {
            font-weight: 700;
            color: #111827;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Cozybox</h1>
        </div>
        <div class="content">
            <p>Hi there!</p>
            <p>You have been invited to <span class="tenant-name">{{.TenantName}}</span> team on Cozybox.</p>
            <p>Click the button below to accept the invitation and get started.</p>
            <a href="{{.InviteUrl}}" class="btn">Accept Invitation</a>
            <p style="margin-top: 30px; font-size: 14px; color: #9ca3af;">
                If the button doesn't work, copy and paste this link into your browser:<br>
                <a href="{{.InviteUrl}}" style="color: #6366f1; word-break: break-all;">{{.InviteUrl}}</a>
            </p>
        </div>
        <div class="footer">
            &copy; 2026 Cozybox. All rights reserved.
        </div>
    </div>
</body>
</html>
